name: Verify GitHub preview consumers
on:
  workflow_dispatch:
    inputs:
      tag:
        description: GitHub release to test
        default: v0.1.0-preview.16
        required: true
  release:
    types: [published]
permissions:
  contents: read
jobs:
  linux-native:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        sample: [Avalonia, Uno]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Native and graphical dependencies
        run: sudo apt-get update && sudo apt-get install -y clang libssl-dev xvfb xauth libfontconfig1 libx11-6 libice6 libsm6 libglib2.0-0t64 libgl1
      - name: Download release and create an isolated consumer
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_TAG: ${{ inputs.tag || github.event.release.tag_name }}
          SAMPLE: ${{ matrix.sample }}
        run: python3 scripts/github-preview.py --download --tag "$PREVIEW_TAG" --sample "$SAMPLE" --output "$RUNNER_TEMP/consumer"
      - name: Build and run the actual application
        env:
          SAMPLE: ${{ matrix.sample }}
        run: |
          set -o pipefail
          project="$RUNNER_TEMP/consumer/Samples/PluginHosts/$SAMPLE/$SAMPLE.csproj"
          dotnet build "$project" -r linux-x64
          xvfb-run -a timeout 120s dotnet run --no-build --project "$project" -r linux-x64 -- --verify | tee "$RUNNER_TEMP/runtime.log"
          grep -q 'no-argument registration, worker native SHA256' "$RUNNER_TEMP/runtime.log"
          grep -q 'automatic host disposed on window close' "$RUNNER_TEMP/runtime.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-${{ matrix.sample }}-linux-x64
          path: ${{ runner.temp }}/runtime.log
